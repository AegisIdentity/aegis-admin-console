# Shared security headers for the admin console.
#
# nginx `add_header` inheritance is all-or-nothing: a `location` that declares ANY `add_header`
# of its own stops inheriting the server-level ones. Every `location` that sets Cache-Control
# therefore `include`s this file so the security headers are re-asserted there and never silently
# dropped on the HTML shell / SPA fallback (see security review H12).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# HSTS: TLS is terminated upstream (ingress/CDN); the header is forwarded to the browser so it
# pins HTTPS and blocks SSL-stripping. Harmless over the container's plain-HTTP :8080 hop.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy — primary mitigation for token/data exfiltration via injected script.
#
#   !!! DEPLOY-TIME ACTION REQUIRED !!!
#   `connect-src` MUST list the exact HTTPS origins this console calls: the edge gateway
#   (VITE_API_BASE) and the OIDC authority (VITE_OIDC_AUTHORITY). The XHR/fetch/OIDC calls are
#   CSP-gated, so the placeholder origins below WILL block all API and login traffic until you
#   replace them with your real origins. `style-src` allows 'unsafe-inline' because Ant Design
#   injects inline styles at runtime.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://REPLACE-with-gateway-origin.example https://REPLACE-with-oidc-origin.example; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
