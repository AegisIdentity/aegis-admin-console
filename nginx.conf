server {
    # Unprivileged nginx (nginxinc/nginx-unprivileged) listens on 8080 as a non-root user.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall back to index.html so client-side routes (/users, /my, ...) work.
    # Security headers are re-declared in every location because any location with its own add_header
    # stops inheriting server-level headers (nginx inheritance rule — see security review H12/M-console).
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Server-level copy for any response not served from the locations above.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
